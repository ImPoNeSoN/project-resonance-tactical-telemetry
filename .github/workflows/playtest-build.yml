name: Playtest build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test ProjectResonance.sln --nologo

      - name: Cache Godot 4.7.2 mono export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot-templates
          key: godot-4.7.2-stable-mono-export-templates

      - name: Download export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz
          mkdir -p "${{ runner.temp }}/godot-templates"
          unzip -q templates.tpz -d "${{ runner.temp }}/godot-templates"

      - name: Install export templates
        run: |
          dest="$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          mkdir -p "$dest"
          cp -a "${{ runner.temp }}/godot-templates/templates/." "$dest/"

      - name: Download Godot 4.7.2 mono
        run: |
          curl -fsSL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          unzip -q godot.zip -d "$HOME/godot-export"
          chmod +x "$HOME/godot-export/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64"

      - name: Export Windows
        run: |
          set -o pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0"
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          mkdir -p build/windows
          "$HOME/godot-export/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64" \
            --headless --path src/Resonance.Game \
            --export-release "Windows Desktop" "$PWD/build/windows/ProjectResonance.exe" \
            | tee export.log
          if grep -E "no solution file|Failed to build project|completed with warnings" export.log; then
            echo "Windows export did not publish a clean .NET player build."
            exit 1
          fi
          python3 -c 'import sys; data=open("build/windows/ProjectResonance.pck","rb").read(); missing=[n.decode() for n in (b"Resonance.Game.dll", b"coreclr.dll", b".glb") if n not in data]; print("export missing", missing) if missing else print("export contains the game assembly, the .NET runtime, and glb models"); sys.exit(1 if missing else 0)'
          cd build/windows
          zip -r "../../ProjectResonance-${version}-win64.zip" .

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ProjectResonance-${{ env.version }}-win64
          path: ProjectResonance-${{ env.version }}-win64.zip

      - name: Attach zip to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ProjectResonance-${{ env.version }}-win64.zip
